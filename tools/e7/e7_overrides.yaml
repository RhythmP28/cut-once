# e7_overrides.yaml: EVERY hand-entered number in the E7 pipeline lives here.
# Pixel coordinates are (x, y) in the downloaded large_jpg images, origin top-left, y grows downward.
# Re-click any stage with:  python tools/e7/01_scale.py --click   (also 02_footprints.py, 03_heights.py)
# The scripts rewrite this file when you click, so comments below this header are not preserved.
source: first pass estimated by eye by an AI assistant from zoomed crops; re-run the three --click steps to refine
method_note: >-
  The AI assistant looked at gridded, upscaled crops of each sheet and read corner positions off the grid,
  then nudged each wall line to the nearest heavy dark line using a row/column darkness profile of the image
  (so straight walls are good to about 1-2 px = 0.1 m; which corners belong to E7 is a judgement call).
  No person has clicked anything yet. When someone does, the stage is time-stamped under clicked_by_person.
clicked_by_person: {}
building_identification: >-
  The sheets do NOT label an "Existing Engineering 5". The only label is "EXISTING ENGINEERING 6" (far right,
  across the road, joined by a bridge on levels 3-7). The WEST wing of the main complex is the existing
  Engineering 5: the Level 7 sheet labels it "existing roof" and the Level 8 sheet shows it as a bare outline.
  Engineering 7 is therefore traced as the EAST bar (8 levels) plus the atrium that joins it to E5.
  Excluded: the E5 west wing, the E5 north box, the bridge to E6, the footbridge over the railway, the site.
frame:
  origin_px: [802, 445]
  origin_note: >-
    Same pixel on every level sheet (the sheets share one template; wall lines agree to 1-3 px between sheets).
    x = 802 is the E5/E7 party-wall line (west edge of the E7 atrium); y = 445 is the north face of the E7 bar.
    Image x -> model +X (drawing right, roughly east-south-east; the north arrow is rotated about 25 degrees
    clockwise from straight up). Image y -> model +Z (drawing down). Model Y = 0 is Level 1 finished floor.
