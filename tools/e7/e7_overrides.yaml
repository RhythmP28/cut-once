section:
  provenance: estimated_from_section
  note: >-
    The published section is a one-point-perspective render cut through the atrium looking east, so the atrium's
    cut end walls (x = 200 and 1258) are at a larger scale than the wall the floor lines are read on. To avoid
    that error the two scale points are two column centre-lines ON THE BACK WALL (the E7 bar's west face), matched
    to the same two columns on the Level 3 plan. All y values below are read on that same back wall.
  scale_ref:
    section_pts_px: [[357, 165], [1019, 165]]
    plan_level: L03
    plan_pts_px: [[972, 629.5], [972, 1327]]
  ground_y: 519
  floor_lines_y: {L02: 456, L03: 401, L04: 346, L05: 291, L06: 234, L07: 181, L08: 126}
  roof_base_y: 80
  roof_top_y: 73
  roof_note: >-
    Floor lines = bottom edge of each storey's glazing (top of the white slab-edge band). The mechanical
    penthouse's own height is not visible in this section. Level 8 is assumed to top out at the sawtooth
    ridge line (y = 25 in the cut plane, which projects to about y = 73 on the back-wall plane, horizon
    taken at y = 500), with an assumed 0.5 m roof build-up (roof_base_y = 80).
